version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./gateway/.env

  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ./services/auth/.env
    volumes:
      - ./services/auth/serviceAccountKey.json:/app/services/auth/serviceAccountKey.json:ro

  chat-service:
    build:
      context: ./services/chat
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - ./services/chat/.env

  agent-service:
    build:
      context: ./services/agent
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - ./services/agent/.env

  billing-service:
    build:
      context: ./services/billing
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    env_file:
      - ./services/billing/.env